<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Deep Agents Demo</title>
  <desc id="desc">A low-poly city skyline planned by a network of agents, with the project name and its features.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#16123a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- Agent network -->
  <g stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <path d="M900 60L1010 92L1130 54M1010 92L1060 150M1010 92L960 140M1130 54L1200 110"/>
  </g>
  <g>
    <circle cx="1010" cy="92" r="9" fill="#a78bfa"/>
    <circle cx="900" cy="60" r="6" fill="#22d3ee"/>
    <circle cx="1130" cy="54" r="6" fill="#22d3ee"/>
    <circle cx="1060" cy="150" r="5" fill="#67e8f9" fill-opacity="0.8"/>
    <circle cx="960" cy="140" r="5" fill="#67e8f9" fill-opacity="0.8"/>
    <circle cx="1200" cy="110" r="5" fill="#67e8f9" fill-opacity="0.8"/>
  </g>

  <!-- Low-poly city -->
  <g stroke="#0b1022" stroke-width="1" stroke-linejoin="round">
    <!-- tower -->
    <polygon points="990,320 990,190 1030,170 1030,320" fill="#4338ca"/>
    <polygon points="1030,320 1030,170 1062,190 1062,320" fill="#312e81"/>
    <polygon points="990,190 1030,170 1062,190 1022,206" fill="#6366f1"/>
    <!-- mid building -->
    <polygon points="1080,320 1080,232 1122,218 1122,320" fill="#4f46e5"/>
    <polygon points="1122,320 1122,218 1160,232 1160,320" fill="#3730a3"/>
    <polygon points="1080,232 1122,218 1160,232 1118,246" fill="#818cf8"/>
    <!-- low building -->
    <polygon points="900,320 900,250 940,238 940,320" fill="#4f46e5"/>
    <polygon points="940,320 940,238 972,250 972,320" fill="#3730a3"/>
    <polygon points="900,250 940,238 972,250 932,262" fill="#818cf8"/>
    <!-- pines -->
    <polygon points="860,320 876,262 892,320" fill="#0e7490"/>
    <polygon points="876,262 892,320 876,320" fill="#155e75"/>
    <polygon points="1176,320 1194,250 1212,320" fill="#0891b2"/>
    <polygon points="1194,250 1212,320 1194,320" fill="#0e7490"/>
    <polygon points="1226,320 1240,272 1254,320" fill="#0e7490"/>
    <polygon points="1240,272 1254,320 1240,320" fill="#155e75"/>
  </g>
  <!-- Windows -->
  <g fill="#22d3ee" fill-opacity="0.7">
    <rect x="1000" y="216" width="6" height="8"/><rect x="1014" y="216" width="6" height="8"/>
    <rect x="1000" y="240" width="6" height="8"/><rect x="1014" y="264" width="6" height="8"/>
    <rect x="1092" y="252" width="6" height="8"/><rect x="1106" y="276" width="6" height="8"/>
    <rect x="912" y="276" width="6" height="8"/>
  </g>
  <line x1="0" y1="319" x2="1280" y2="319" stroke="url(#accent)" stroke-width="2"/>

  <!-- Text -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="72" font-size="16" font-weight="600" letter-spacing="3" fill="#22d3ee">LANGCHAIN · DEEP AGENTS</text>
    <text x="62" y="146" font-size="64" font-weight="700" fill="#f8fafc">Deep Agents Demo</text>
    <text x="64" y="188" font-size="22" fill="#cbd5e1">An agent harness that plans 3D city scenes</text>
    <g font-size="15" font-weight="600" fill="#e0e7ff">
      <rect x="64" y="222" width="96" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="112" y="243" text-anchor="middle">Planning</text>
      <rect x="170" y="222" width="104" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="222" y="243" text-anchor="middle">Subagents</text>
      <rect x="284" y="222" width="132" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="350" y="243" text-anchor="middle">Mem0 memory</text>
      <rect x="426" y="222" width="116" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="484" y="243" text-anchor="middle">Qdrant RAG</text>
      <rect x="552" y="222" width="156" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="630" y="243" text-anchor="middle">OpenShell sandbox</text>
    </g>
  </g>
</svg>
