requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents==0.7.34",
    "langchain-daytona>=0.0.9",
    "langchain-openai>=1,<2",
    "langchain-text-splitters>=1.1.3",
    "langgraph-checkpoint-sqlite>=3,<4",
    "mem0ai>=2.2.1",
    "openai>=3.46.0",
    "playwright>=1.64.1",
    "python-dotenv>=1,<2",
    "qdrant-client>=1.20.0",
]

[tool.uv]
package = false
