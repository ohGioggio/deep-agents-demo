[project]
name = "deep-agents-demo"
version = "0.1.0"
description = "A small Deep Agents example with tools, skills, memory and delegation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Gioele Allievi", email = "stragio.gio@gmail.com" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents==0.7.34",
    "langchain-daytona>=0.0.9",
    "langchain-openai>=1,<2",
    "langchain-text-splitters>=1.1.3",
    "langgraph-checkpoint-sqlite>=3,<4",
    "mem0ai>=2.2.1",
    "openai>=3.46.0",
    "openshell>=0.1.7",
    "pillow>=13.0.0",
    "prompt-toolkit>=3.0.50",
    "python-dotenv>=1,<2",
    "qdrant-client>=1.20.0",
]

[project.scripts]
deep-agents-demo = "deep_agents_demo.ui.cli.main:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
