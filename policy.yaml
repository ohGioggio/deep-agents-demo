# OpenShell sandbox policy for deep-agents-demo (schema version 1, OpenShell 0.1.x).
# Binary paths match the image in sandbox/Dockerfile. Apply at creation:
#   openshell sandbox create --name deep-agents-demo --from deep-agents-demo-sandbox:0.1 \
#     --policy policy.yaml --detach
# Network rules hot-reload:  openshell policy set deep-agents-demo --policy policy.yaml --wait
# filesystem_policy, landlock and process are fixed when the sandbox starts;
# changing them means recreating the sandbox.
#
# Network is deny-by-default: only the rules below are allowed. Every endpoint
# sets enforcement: enforce, because the default (audit) only logs violations.
# Rules bind to binaries by their real path (not a symlink); a connection from
# any other program is denied.
version: 1

filesystem_policy:
  include_workdir: true          # /sandbox, where the agent works
  read_only: [/usr, /lib, /etc]
  read_write: [/tmp]

landlock:
  compatibility: best_effort

# No process block: commands run as the image's user, otherwise UID 1000 (never
# root). The default image has no "sandbox" user, so naming one fails at creation.

network_policies:
  # Package downloads only: GET/HEAD/OPTIONS, no uploads to PyPI.
  pypi:
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/python3.12
      - path: /usr/local/bin/uv
      - path: /sandbox/.local/bin/uv
      - path: /sandbox/.local/share/uv/python/*/bin/python3*

  # git clone/fetch over HTTPS; push (git-receive-pack) is not allowed.
  # Clone sends a POST to git-upload-pack, so access: read-only would block it.
  github-clone:
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          # Only the clone/fetch handshake; push asks for service=git-receive-pack.
          - allow:
              method: GET
              path: "/*/*/info/refs"
              query:
                service: git-upload-pack
          - allow:
              method: POST
              path: "/*/*/git-upload-pack"
    binaries:
      # git-remote-https is a symlink to this binary; rules need the real path.
      - path: /usr/lib/git-core/git-remote-http
